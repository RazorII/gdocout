name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest is Ubuntu 26.04, which setup-python has no 3.9 for; 24.04 still proves the 3.9 minimum on Linux
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install gdocout
        run: python -m pip install -e ".[test]"
      - name: Command works
        run: gdocout --version
      - name: Tests (offline, against a fake Google)
        run: python -m pytest -v
      - name: Against the real Google (Google's own public samples)
        if: matrix.python == '3.13'
        env:
          GDOCOUT_NETWORK_TESTS: "1"
        run: python -m pytest -v tests/test_network.py
